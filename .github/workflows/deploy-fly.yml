# Publishes the live site (Fly.io) whenever main changes, including changes merged from the dashboard chat.
# Needs one repository secret: FLY_API_TOKEN (create with `fly tokens create deploy`).
name: Deploy to Fly.io

on:
  push:
    branches: [main]
    # Content changes publish here. Server and API changes already publish through deploy.yml.
    paths-ignore:
      - 'server/**'
      - 'api/**'
      - 'fly.toml'
      - 'scripts/deploy.sh'
  workflow_dispatch:

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so build_guide.py can date every page
      - name: Date pages for the Guide
        run: python3 scripts/build_guide.py
      - name: Stamp deploy time and commit for the site footer
        run: printf '{\n  "deployedAt": "%s",\n  "commit": "%s"\n}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${GITHUB_SHA::7}" > data/deploy.json
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
