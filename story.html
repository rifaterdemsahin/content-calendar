<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Story | @RifatErdemSahin</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%93%96</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .tl { position: relative; }
    .tl::before { content: ''; position: absolute; left: 23px; top: 8px; bottom: 8px; width: 2px; background: linear-gradient(#6366f1, #a855f7 60%, #ec4899); opacity: .5; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased selection:bg-indigo-500 selection:text-white">

  <header class="sticky top-0 z-50 backdrop-blur-md bg-slate-950/80 border-b border-slate-800">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between">
      <a href="index.html" class="text-sm text-slate-300 hover:text-indigo-400 transition"><i class="fas fa-arrow-left mr-1"></i> Dashboard</a>
      <span class="font-bold tracking-tight">📖 My Story</span>
      <a href="what-works.html" class="text-sm text-slate-300 hover:text-indigo-400 transition">What works <i class="fas fa-arrow-right ml-1"></i></a>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 sm:px-6 py-12 space-y-16">
    <section class="relative">
      <div class="absolute inset-0 -z-10 bg-[radial-gradient(ellipse_70%_80%_at_20%_0%,rgba(120,119,198,0.18),rgba(255,255,255,0))]"></div>
      <h2 class="text-xs font-bold text-indigo-400 uppercase tracking-widest">The main story</h2>
      <h1 id="name" class="text-4xl sm:text-5xl font-extrabold tracking-tight text-white mt-2"></h1>
      <p id="tagline" class="text-lg sm:text-xl text-slate-300 mt-4 leading-relaxed max-w-2xl"></p>
      <div class="flex flex-wrap gap-2 mt-6">
        <a id="li" target="_blank" rel="noopener" class="text-sm px-3 py-1.5 rounded-lg bg-sky-600/20 hover:bg-sky-600/30 text-sky-300 border border-sky-500/30 flex items-center gap-2"><i class="fab fa-linkedin"></i> LinkedIn</a>
        <a id="yt" target="_blank" rel="noopener" class="text-sm px-3 py-1.5 rounded-lg bg-red-600/20 hover:bg-red-600/30 text-red-300 border border-red-500/30 flex items-center gap-2"><i class="fab fa-youtube"></i> YouTube</a>
      </div>
      <blockquote id="belief" class="mt-8 border-l-4 border-indigo-500 pl-5 text-xl text-white font-medium leading-relaxed"></blockquote>
    </section>

    <section>
      <h2 class="text-xs font-bold text-indigo-400 uppercase tracking-widest">The journey</h2>
      <p class="text-2xl font-bold text-white mt-2">From Turkey to the cockpit</p>
      <ol id="chapters" class="tl mt-8 space-y-8"></ol>
    </section>

    <section>
      <h2 class="text-xs font-bold text-indigo-400 uppercase tracking-widest">What I stand for</h2>
      <div id="values" class="mt-6 grid gap-4 sm:grid-cols-2"></div>
    </section>

    <section>
      <h2 class="text-xs font-bold text-emerald-400 uppercase tracking-widest">Story → channel</h2>
      <p id="on-title" class="text-2xl font-bold text-white mt-2"></p>
      <p id="on-detail" class="text-slate-400 mt-2 max-w-3xl"></p>
      <div id="on-videos" class="mt-6 grid gap-3 grid-cols-2 md:grid-cols-5"></div>
      <p class="text-lg font-bold text-white mt-10">Videos the story could carry next</p>
      <div id="ideas" class="mt-4 grid gap-3"></div>
    </section>

    <p id="status" class="text-xs text-slate-500"></p>
  </main>

  <footer class="py-8 text-center text-xs text-slate-500 border-t border-slate-800">
    The story text lives in <code class="text-slate-400">data/story.json</code>. Edit it there (or ask the chat agent).
  </footer>

  <script>
    const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
    const json = (r) => r.json();
    Promise.all([
      fetch('data/story.json', { cache: 'no-cache' }).then(json),
      fetch('data/latest-videos.json', { cache: 'no-cache' }).then(json),
      fetch('data/past-performance.json', { cache: 'no-cache' }).then(json),
    ]).then(([s, latest, past]) => {
      const vids = {}; [...past.all_videos, ...latest.videos].forEach((v) => { vids[v.id] = { ...vids[v.id], ...v }; });
      document.getElementById('name').textContent = s.name;
      document.getElementById('tagline').textContent = s.tagline;
      document.getElementById('belief').textContent = `“${s.belief}”`;
      document.getElementById('li').href = s.linkedin; document.getElementById('yt').href = s.youtube;

      document.getElementById('chapters').append(...s.chapters.map((c, i) => {
        const li = el('li', 'relative flex gap-5');
        li.append(el('div', 'relative z-10 w-12 h-12 shrink-0 rounded-full bg-slate-900 border-2 border-indigo-500/60 flex items-center justify-center text-2xl', c.icon));
        const b = el('div', 'pt-1');
        b.append(el('div', 'text-xs uppercase font-bold tracking-wider text-indigo-300', `${i + 1} · ${c.place}`), el('h3', 'text-xl font-bold text-white mt-1', c.title), el('p', 'text-slate-300 mt-2 leading-relaxed', c.text));
        li.append(b); return li;
      }));

      document.getElementById('values').append(...s.values.map((v) => {
        const c = el('div', 'p-5 rounded-xl border border-slate-800 bg-slate-900');
        c.append(el('div', 'text-2xl', v.icon), el('div', 'font-bold text-white mt-2', v.title), el('p', 'text-sm text-slate-400 mt-1', v.text));
        return c;
      }));

      document.getElementById('on-title').textContent = s.onChannel.title;
      document.getElementById('on-detail').textContent = s.onChannel.detail;
      document.getElementById('on-videos').append(...s.onChannel.videos.map((id) => {
        const v = vids[id] || { title: id, views: 0, url: `https://www.youtube.com/watch?v=${id}`, type: '' };
        const a = el('a', 'block rounded-xl border border-slate-800 bg-slate-900 overflow-hidden hover:border-slate-600 transition'); a.href = v.url; a.target = '_blank'; a.rel = 'noopener';
        const img = el('img', 'w-full aspect-video object-cover'); img.src = `https://i.ytimg.com/vi/${id}/hqdefault.jpg`; img.alt = ''; img.loading = 'lazy';
        const b = el('div', 'p-2.5'); b.append(el('div', 'text-xs text-slate-100 leading-snug line-clamp-2', v.title), el('div', 'text-[11px] text-slate-400 mt-1', `${/short/i.test(v.type) ? '🎬 Short' : '📹 Long'} · ${v.views} views`));
        a.append(img, b); return a;
      }));

      document.getElementById('ideas').append(...s.storyIdeas.map((x) => {
        const c = el('div', 'p-4 rounded-xl border border-slate-800 bg-slate-900');
        const h = el('div', 'flex flex-wrap items-center gap-2');
        h.append(el('span', 'font-semibold text-white', x.title), el('span', 'text-[10px] uppercase tracking-wider font-bold px-2 py-0.5 rounded-full border border-emerald-500/40 text-emerald-300', x.pillar));
        c.append(h, el('p', 'text-sm text-slate-400 mt-1', x.why)); return c;
      }));
      document.getElementById('status').textContent = `${s.draft} · updated ${s.updated}`;
    }).catch((e) => { document.getElementById('status').textContent = 'Could not load data/story.json: ' + e.message; });
  </script>
  <script src="assets/cc-widget.js" data-api="/api"></script>
  <script src="assets/cc-notifications.js"></script>
  <script src="assets/cc-guide.js"></script>
  <script src="assets/cc-diagram.js"></script>
</body>
</html>
