<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Research: AGI, Work & Meaning | @RifatErdemSahin</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%93%9C</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased selection:bg-indigo-500 selection:text-white">

  <header class="sticky top-0 z-50 backdrop-blur-md bg-slate-950/80 border-b border-slate-800">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between">
      <a href="mentors.html" class="text-sm text-slate-300 hover:text-indigo-400 transition"><i class="fas fa-arrow-left mr-1"></i> Mentors</a>
      <span class="font-bold tracking-tight">📜 Research</span>
      <a href="core-message.html" class="text-sm text-slate-300 hover:text-indigo-400 transition">Core message <i class="fas fa-arrow-right ml-1"></i></a>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 sm:px-6 py-12 space-y-14">
    <section>
      <h2 class="text-xs font-bold text-indigo-400 uppercase tracking-widest">Erdem's research paper</h2>
      <h1 class="text-3xl sm:text-4xl font-bold text-white mt-2">📜 AGI, the workforce &amp; meaning</h1>
      <p id="summary" class="text-lg text-slate-300 mt-4 max-w-3xl leading-relaxed"></p>
      <div id="paper" class="mt-6"></div>
    </section>

    <section>
      <h2 class="text-2xl font-bold text-white">🧵 The three threads</h2>
      <div id="threads" class="mt-6 grid gap-5 lg:grid-cols-3"></div>
    </section>

    <section id="bridge" class="p-6 rounded-2xl border border-indigo-500/40 bg-gradient-to-br from-indigo-950/50 to-slate-900"></section>

    <section>
      <h2 class="text-2xl font-bold text-white">📺 From paper to channel</h2>
      <div id="to-channel" class="mt-5 grid gap-3 sm:grid-cols-2"></div>
    </section>

    <p id="rule" class="p-4 rounded-xl border border-amber-500/30 bg-amber-950/15 text-sm text-amber-100"></p>
    <p id="status" class="text-xs text-slate-500"></p>
  </main>

  <footer class="py-8 text-center text-xs text-slate-500 border-t border-slate-800">
    The research page lives in <code class="text-slate-400">data/research.json</code>. Add the paper's title, abstract and link there.
  </footer>

  <script>
    const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
    const json = (r) => r.json();
    Promise.all([
      fetch('data/research.json', { cache: 'no-cache' }).then(json),
      fetch('data/latest-videos.json', { cache: 'no-cache' }).then(json),
      fetch('data/past-performance.json', { cache: 'no-cache' }).then(json),
    ]).then(([d, latest, past]) => {
      const vids = {}; [...past.all_videos, ...latest.videos].forEach((v) => { vids[v.id] = { ...vids[v.id], ...v }; });
      document.getElementById('summary').textContent = d.summary;
      const p = d.paper; const box = document.getElementById('paper');
      if (p.title) {
        const c = el('div', 'p-5 rounded-2xl border border-slate-700 bg-slate-900');
        c.append(el('div', 'text-xs uppercase font-bold text-slate-400', `📄 Paper${p.status ? ' · ' + p.status : ''}`), el('div', 'text-xl font-bold text-white mt-1', p.title));
        if (p.abstract) c.append(el('p', 'text-sm text-slate-300 mt-3 leading-relaxed', p.abstract));
        if (p.link) { const a = el('a', 'inline-block mt-3 text-sm text-indigo-300 hover:underline', '🔗 Read the paper →'); a.href = p.link; a.target = '_blank'; a.rel = 'noopener'; c.append(a); }
        box.append(c);
      } else box.append(el('div', 'p-4 rounded-xl border border-dashed border-amber-500/40 bg-amber-950/10 text-sm text-amber-100', `✍️ ${p.todo}`));

      document.getElementById('threads').append(...d.threads.map((t, i) => {
        const c = el('article', 'rounded-2xl border border-slate-800 bg-slate-900 p-5 flex flex-col'); c.id = t.key;
        c.append(el('div', 'text-xs uppercase font-bold text-indigo-300', `Thread ${i + 1}`), el('h3', 'text-xl font-bold text-white mt-1', `${t.icon} ${t.title}`),
          el('p', 'mt-3 text-slate-100 font-medium', `❓ ${t.question}`), el('p', 'mt-2 text-sm text-slate-400', t.why));
        c.append(el('div', 'text-xs uppercase font-bold text-emerald-300 mt-4', '🎬 Already on the channel'));
        const g = el('div', 'mt-2 grid gap-2');
        t.videos.forEach((id) => {
          const v = vids[id] || { title: id, views: 0, url: `https://www.youtube.com/watch?v=${id}` };
          const a = el('a', 'flex gap-3 items-center p-2 rounded-lg border border-slate-800 hover:border-slate-600 bg-slate-950/60'); a.href = v.url; a.target = '_blank'; a.rel = 'noopener';
          const img = el('img', 'w-20 aspect-video object-cover rounded shrink-0'); img.src = `https://i.ytimg.com/vi/${id}/mqdefault.jpg`; img.alt = ''; img.loading = 'lazy';
          const b = el('div', 'min-w-0'); b.append(el('div', 'text-xs text-slate-100 leading-snug line-clamp-2', v.title), el('div', 'text-[11px] text-slate-400 mt-0.5', `${v.views} views`));
          a.append(img, b); g.append(a);
        });
        c.append(g); return c;
      }));
      const br = document.getElementById('bridge'); br.append(el('h2', 'text-xl font-bold text-white', d.bridge.title), el('p', 'text-slate-200 mt-2 leading-relaxed', d.bridge.text));
      document.getElementById('to-channel').append(...d.toChannel.map((x) => { const c = el('div', 'p-4 rounded-xl border border-slate-800 bg-slate-900'); c.append(el('div', 'font-bold text-white', `${x.icon} ${x.title}`), el('p', 'text-sm text-slate-400 mt-1', x.detail)); return c; }));
      document.getElementById('rule').textContent = d.rule;
      document.getElementById('status').textContent = `Updated ${d.updated}`;
    }).catch((e) => { document.getElementById('status').textContent = 'Could not load research data: ' + e.message; });
  </script>
  <script src="assets/cc-widget.js" data-api="/api"></script>
  <script src="assets/cc-notifications.js"></script>
  <script src="assets/cc-guide.js"></script>
  <script src="assets/cc-diagram.js"></script>
  <script src="assets/cc-pagenav.js"></script>
  <script src="assets/cc-footer.js"></script>
</body>
</html>
