<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Passions | @RifatErdemSahin</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%94%A5</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased selection:bg-indigo-500 selection:text-white">

  <header class="sticky top-0 z-50 backdrop-blur-md bg-slate-950/80 border-b border-slate-800">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between">
      <a href="ikigai.html" class="text-sm text-slate-300 hover:text-indigo-400 transition"><i class="fas fa-arrow-left mr-1"></i> Ikigai</a>
      <span class="font-bold tracking-tight">🔥 My Passions</span>
      <a href="interests.html" class="text-sm text-slate-300 hover:text-indigo-400 transition">What I care about <i class="fas fa-arrow-right ml-1"></i></a>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 sm:px-6 py-12 space-y-14">
    <section>
      <h2 class="text-xs font-bold text-orange-400 uppercase tracking-widest">What lights me up</h2>
      <h1 class="text-3xl sm:text-4xl font-bold text-white mt-2">🔥 My passions</h1>
      <p id="intro" class="text-lg text-slate-300 mt-4 max-w-3xl leading-relaxed"></p>
      <div id="stats" class="mt-6 grid gap-3 grid-cols-3"></div>
    </section>

    <section id="passions" class="space-y-6"></section>

    <section id="loop" class="p-6 rounded-2xl border border-orange-500/40 bg-gradient-to-br from-orange-950/30 to-slate-900"></section>

    <section>
      <h2 class="text-xl font-bold text-white">✨ Also passionate about</h2>
      <div id="also" class="mt-4 flex flex-wrap gap-2"></div>
    </section>

    <p id="status" class="text-xs text-slate-500"></p>
  </main>

  <footer class="py-8 text-center text-xs text-slate-500 border-t border-slate-800">
    Passions live in <code class="text-slate-400">data/passion.json</code>.
  </footer>

  <script>
    const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
    fetch('data/passion.json', { cache: 'no-cache' }).then((r) => r.json()).then((d) => {
      document.getElementById('intro').textContent = d.intro;
      document.getElementById('stats').append(...d.stats.map((x) => { const c = el('div', 'p-4 rounded-xl border border-slate-800 bg-slate-900'); c.append(el('div', 'text-2xl', x.icon), el('div', 'text-2xl font-extrabold text-white mt-1', x.value), el('div', 'text-xs text-slate-400', x.label)); return c; }));
      document.getElementById('passions').append(...d.passions.map((p, i) => {
        const c = el('article', 'rounded-2xl border border-slate-800 bg-slate-900 overflow-hidden md:grid md:grid-cols-[minmax(0,1fr)_minmax(0,1fr)]'); c.id = p.key;
        const left = el('div', 'p-6');
        left.append(el('div', 'text-xs uppercase font-bold text-orange-300', `Passion ${i + 1}`), el('h2', 'text-2xl font-bold text-white mt-1', `${p.icon} ${p.title}`), el('p', 'text-slate-300 mt-3 leading-relaxed', p.what));
        const pr = el('p', 'mt-4 text-sm text-slate-200 p-3 rounded-lg bg-slate-950/60 border border-slate-800'); pr.append(el('span', 'font-semibold text-indigo-300', '🧾 Proof: '), document.createTextNode(p.proof)); left.append(pr);
        const right = el('div', 'p-6 border-t md:border-t-0 md:border-l border-slate-800 bg-emerald-950/10');
        right.append(el('h3', 'text-xs uppercase font-bold text-emerald-300', '📺 On the channel'));
        const ul = el('ul', 'mt-3 space-y-2'); p.channel.forEach((x) => ul.append(el('li', 'text-sm text-slate-200', x))); right.append(ul);
        c.append(left, right); return c;
      }));
      const l = document.getElementById('loop'); l.append(el('h2', 'text-xl font-bold text-white', d.loop.title), el('p', 'text-slate-200 mt-2', d.loop.text));
      document.getElementById('also').append(...d.alsoPassionate.map((x) => { const a = el('a', 'px-3 py-1.5 rounded-full border border-slate-700 bg-slate-900 hover:border-orange-400 text-sm text-slate-200', `${x.icon} ${x.text}`); a.href = x.href; return a; }));
      document.getElementById('status').textContent = `Updated ${d.updated}`;
    }).catch((e) => { document.getElementById('status').textContent = 'Could not load data/passion.json: ' + e.message; });
  </script>
  <script src="assets/cc-widget.js" data-api="/api"></script>
  <script src="assets/cc-notifications.js"></script>
  <script src="assets/cc-guide.js"></script>
  <script src="assets/cc-diagram.js"></script>
  <script src="assets/cc-pagenav.js"></script>
</body>
</html>
