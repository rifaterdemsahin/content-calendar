<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quarterly Report | @RifatErdemSahin</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%A7%BE</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased selection:bg-indigo-500 selection:text-white">
  <header class="sticky top-0 z-50 backdrop-blur-md bg-slate-950/80 border-b border-slate-800">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between gap-3">
      <a href="index.html" class="text-sm text-slate-300 hover:text-indigo-400 transition shrink-0"><i class="fas fa-arrow-left mr-1"></i> Dashboard</a>
      <a href="performance.html" class="text-sm text-slate-300 hover:text-indigo-400 transition shrink-0">Performance Report <i class="fas fa-arrow-right ml-1"></i></a>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 sm:px-6 py-12 space-y-12">
    <section>
      <h2 class="text-xs font-bold text-indigo-400 uppercase tracking-widest">Report · every quarter</h2>
      <h1 class="text-3xl sm:text-4xl font-bold text-white mt-2">🧾 Quarterly Report</h1>
      <p id="headline" class="text-slate-300 mt-4 max-w-3xl text-lg leading-relaxed"></p>
    </section>

    <section>
      <h2 class="text-xs font-bold text-slate-400 uppercase tracking-widest">📊 The quarter in numbers</h2>
      <div id="tiles" class="mt-4 grid grid-cols-2 lg:grid-cols-4 gap-3"></div>
    </section>

    <section>
      <h2 class="text-xs font-bold text-slate-400 uppercase tracking-widest">🎯 Subscriber goal</h2>
      <div class="mt-4 rounded-xl border border-slate-800 bg-slate-900/50 p-5">
        <div id="goalText" class="text-sm text-slate-300"></div>
        <div class="mt-3 h-3 rounded-full bg-slate-800 overflow-hidden"><div id="goalBar" class="h-full bg-indigo-500"></div></div>
        <div id="goalPace" class="text-xs text-slate-400 mt-3"></div>
      </div>
    </section>

    <section>
      <h2 class="text-xs font-bold text-slate-400 uppercase tracking-widest">🧩 Views by topic</h2>
      <div id="topics" class="mt-4 rounded-xl border border-slate-800 bg-slate-900/50 p-4 space-y-3"></div>
    </section>

    <section>
      <h2 class="text-xs font-bold text-slate-400 uppercase tracking-widest">🏆 Top videos</h2>
      <ol id="top" class="mt-4 space-y-2"></ol>
    </section>

    <p id="status" class="text-xs text-slate-500"></p>
  </main>

  <script>
    const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
    const fmt = (n) => Number(n).toLocaleString('en-US');
    Promise.all(['data/goals.json', 'data/past-performance.json'].map((u) => fetch(u).then((r) => { if (!r.ok) throw new Error(u); return r.json(); }))).then(([g, p]) => {
      const now = new Date();
      const q = Math.floor(now.getMonth() / 3) + 1;
      const start = new Date(now.getFullYear(), (q - 1) * 3, 1), end = new Date(now.getFullYear(), q * 3, 0);
      const pct = Math.round(((now - start) / (end - start)) * 100);
      document.getElementById('headline').textContent = `Q${q} ${now.getFullYear()}: ${Math.min(pct, 100)}% of the quarter has passed. ${fmt(p.subscribers)} subscribers and ${fmt(p.total_views_recorded)} views across ${p.total_videos_analyzed} videos.`;
      const tiles = [['Subscribers', fmt(p.subscribers)], ['Total views', fmt(p.total_views_recorded)], ['Avg views / long video', p.average_views_long_form], ['Avg views / Short', p.average_views_shorts]];
      document.getElementById('tiles').append(...tiles.map(([k, v]) => { const d = el('div', 'rounded-xl border border-slate-800 bg-slate-900 p-4'); d.append(el('div', 'text-xs text-slate-400', k), el('div', 'text-2xl font-bold text-white mt-1', v)); return d; }));

      const goal = g.dates.subscriberGoal, dl = new Date(g.dates.subscriberDeadline);
      const weeksLeft = Math.max(0, Math.ceil((dl - now) / 6048e5));
      const need = Math.max(0, goal - g.subscribers);
      document.getElementById('goalText').textContent = `${fmt(g.subscribers)} of ${fmt(goal)} subscribers by ${g.dates.subscriberDeadline}.`;
      document.getElementById('goalBar').style.width = Math.min(100, (g.subscribers / goal) * 100) + '%';
      const rate = g.weeklyRate[g.activeRate];
      document.getElementById('goalPace').textContent = need === 0 ? 'Goal reached.' : `Needs ${fmt(need)} more in ${weeksLeft} weeks (${weeksLeft ? (need / weeksLeft).toFixed(1) : need}/week). The ${g.activeRate} pace of ${rate}/week gives ${fmt(g.subscribers + rate * weeksLeft)}.`;

      const topics = Object.entries(p.topic_views_distribution).sort((a, b) => b[1] - a[1]);
      const max = topics[0][1];
      document.getElementById('topics').append(...topics.map(([k, v]) => { const r = el('div'); const bar = el('div', 'h-2 rounded bg-indigo-500 mt-1'); bar.style.width = (v / max) * 100 + '%'; r.append(el('div', 'text-sm text-slate-300', `${k}: ${fmt(v)} views`), bar); return r; }));

      document.getElementById('top').append(...p.top_performing_videos.slice(0, 5).map((v) => { const li = el('li', 'rounded-xl border border-slate-800 bg-slate-900 p-3 flex justify-between gap-3'); const a = el('a', 'text-sm text-slate-200 hover:text-indigo-300', v.title); a.href = v.url; a.target = '_blank'; a.rel = 'noopener'; li.append(a, el('span', 'text-sm text-slate-400 shrink-0', fmt(v.views) + ' views')); return li; }));
      document.getElementById('status').textContent = `Subscribers as of ${g.asOf}. Source: data/goals.json and data/past-performance.json.`;
    }).catch((e) => { document.getElementById('status').textContent = 'Could not load quarterly data: ' + e.message; });
  </script>
  <script src="assets/cc-widget.js" data-api="/api"></script>
  <script src="assets/cc-notifications.js"></script>
  <script src="assets/cc-guide.js"></script>
  <script src="assets/cc-diagram.js"></script>
  <script src="assets/cc-pagenav.js"></script>
</body>
</html>
